name: Daily Market & MDD Dashboard Update

on:
  schedule:
    # 월~금 22:00 UTC (한국 시간 화~토 오전 07:00, 미국 증시 장 마감 직후)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 깃허브 웹 화면에서 'Run workflow' 버튼으로 수동 실행 지원

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect Stock Data & Build Dashboard
        run: |
          python build_unified_dashboard.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock data and news [skip ci]" && git push)
